<!DOCTYPE html>
<html lang="pt_BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xhopii</title>
    <link rel="stylesheet" href="../assets/style.css">
</head>
<body>
    <header class="cabecalho">
        <div class="cabecalho-topo">
            <img src="../assets/img/logo.png" alt="Logotipo Xhopii" class="logo-img">
            <h1 class="cabecalho-logo">Xhopii</h1>
        </div>
        <nav class="cabecalho-nav">
            <ul class="nav-lista">
                <li><a  href="#" class="nav-link">Home</a></li>
                <li><a  href="#" class="nav-link">Cadastro Cliente</a></li>
                <li><a  href="#" class="nav-link">Cadastro Funcionário</a></li>
                <li><a  href="#" class="nav-link">Cadastro produto</a></li>
                <li><a  href="#" class="nav-link">Ver Clientes</a></li>
                <li><a  href="#" class="nav-link">Ver Funcionários</a></li>
                <li><a  href="#" class="nav-link">Ver Produtos</a></li>
            </ul>
        </nav>
    </header>
    <main class="conteudo-principal">
        <article class="produto">
            <section class="produto-galeria">
                <div class="miniaturas">
                    <img src="../assets/img/produto1.png" alt="Camisa Preta"  class="miniatura ativo">
                    <img src="../assets/img/produto2.png" alt="Camisa Azul"  class="miniatura">
                    <img src="../assets/img/produto3.png" alt="Camisa Verde"  class="miniatura">
                    <img src="../assets/img/produto4.png" alt="Camisa Cinza"  class="miniatura">
                    <img src="../assets/img/produto5.png" alt="Camisa Rosa"  class="miniatura">
                </div>
                <div class="imagem-destaque">
                    <img src="../assets/img/produto1.png" alt="Camisa em destaque" class="foto-principal">
                </div>
            </section>
            <section class="produto-detalhes">
                <h2 class="produto-titulo">Camisa Desenvolvedor Front-End CSS</h2>
                <p class="produto-preco">R$56,90</p>
                <p class="produto-estoque">171 peças disponíveis</p>
                <div class="opcoes-grupo">
                    <span class="opcoes-rotulo">Modelos:</span>
                    <div class="opcoes-butoes">
                        <button type="button" class="btn-opcao ativo">Preta</button>
                        <button type="button" class="btn-opcao">Azul</button>
                        <button type="button" class="btn-opcao">Verde</button>
                        <button type="button" class="btn-opcao">Cinza</button>
                        <button type="button" class="btn-opcao">Rosa</button>
                    </div>
                </div>            
                    <span class="opcoes-rotulo">Tamanho:</span>
                    <div class="opcoes-butoes">
                        <button type="button" class="btn-opcao ativo">P</button>
                        <button type="button" class="btn-opcao">M</button>
                        <button type="button" class="btn-opcao">G</button>
                        <button type="button" class="btn-opcao">GG</button>
                    </div>
                </div>
                <p class="produto-selecao-atual">Tamanho selecionado: <strong>P</strong></p>
                <button type="button" class="btn-comprar">Comprar Agora</button>
            </section>
        </article>
    </main>
</body>
</html>
